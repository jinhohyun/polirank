name: Weekly PoliRank Data Update

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-polirank-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python weekly_updater.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed_data_all.json seed_data.json polirank.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly automated update of 299 MPs public & news data [skip ci]"
            git push
          fi
